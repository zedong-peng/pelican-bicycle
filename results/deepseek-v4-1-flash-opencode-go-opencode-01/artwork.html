<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #e8f6ff;
    font-family: system-ui, sans-serif;
  }
  svg { width: min(96vw, 1100px); height: auto; display: block; }

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1300px); } }
  .cloud { animation: drift linear infinite; }
  .cloud1 { animation-duration: 26s; animation-delay: -10s; }
  .cloud2 { animation-duration: 34s; animation-delay: -22s; }
  .cloud3 { animation-duration: 21s; animation-delay: -5s; }

  @keyframes sunspin { to { transform: rotate(360deg); } }
  .rays { transform-box: view-box; transform-origin: 110px 92px; animation: sunspin 30s linear infinite; }
  @keyframes glowpulse {
    0%, 100% { opacity: .15; transform: scale(1); }
    50%      { opacity: .4;  transform: scale(1.1); }
  }
  .glow { transform-box: view-box; transform-origin: 110px 92px; animation: glowpulse 3s ease-in-out infinite; }

  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .rider { animation: bob .6s ease-in-out infinite alternate; }

  @keyframes wheelspin { to { transform: rotate(360deg); } }
  .wheel-spin { animation: wheelspin .6s linear infinite; }
  .wheel-rear  { transform-box: view-box; transform-origin: 300px 370px; }
  .wheel-front { transform-box: view-box; transform-origin: 560px 370px; }

  @keyframes crank     { to { transform: rotate(360deg); } }
  @keyframes crank-rev { to { transform: rotate(-360deg); } }
  .crank   { transform-box: view-box; transform-origin: 430px 370px; animation: crank 1.2s linear infinite; }
  .counter { transform-box: view-box; animation: crank-rev 1.2s linear infinite; }

  @keyframes roadmove { from { transform: translateX(0); } to { transform: translateX(-240px); } }
  .road-move { animation: roadmove 1.2s linear infinite; }

  /* 腿部 IK：大腿绕髋关节、小腿绕膝关节 */
  .thigh-near { transform-box: view-box; transform-origin: 390px 262px; animation: thigh-near 1.2s linear infinite; }
  .shin-near  { transform-box: view-box; transform-origin: 409.6px 314.4px; animation: shin-near 1.2s linear infinite; }
  .thigh-far  { transform-box: view-box; transform-origin: 382px 268px; animation: thigh-far 1.2s linear infinite; }
  .shin-far   { transform-box: view-box; transform-origin: 436.8px 256.3px; animation: shin-far 1.2s linear infinite; }

  @keyframes thigh-near {
    0%, 100% { transform: rotate(0deg); }
    8.3333% { transform: rotate(-13.5deg); }
    16.6667% { transform: rotate(-24.73deg); }
    25.0% { transform: rotate(-37.49deg); }
    33.3333% { transform: rotate(-52.13deg); }
    41.6667% { transform: rotate(-66.28deg); }
    50.0% { transform: rotate(-74.12deg); }
    58.3333% { transform: rotate(-71.76deg); }
    66.6667% { transform: rotate(-60.79deg); }
    75.0% { transform: rotate(-44.38deg); }
    83.3333% { transform: rotate(-24.46deg); }
    91.6667% { transform: rotate(-2.53deg); }
  }
  @keyframes shin-near {
    0%, 100% { transform: rotate(0deg); }
    8.3333% { transform: rotate(30.77deg); }
    16.6667% { transform: rotate(54.66deg); }
    25.0% { transform: rotate(75.58deg); }
    33.3333% { transform: rotate(91.84deg); }
    41.6667% { transform: rotate(100.35deg); }
    50.0% { transform: rotate(98.43deg); }
    58.3333% { transform: rotate(86.77deg); }
    66.6667% { transform: rotate(68.57deg); }
    75.0% { transform: rotate(46.49deg); }
    83.3333% { transform: rotate(21.5deg); }
    91.6667% { transform: rotate(-5.42deg); }
  }
  @keyframes thigh-far {
    0%, 100% { transform: rotate(0deg); }
    8.3333% { transform: rotate(3.89deg); }
    16.6667% { transform: rotate(15.76deg); }
    25.0% { transform: rotate(32.2deg); }
    33.3333% { transform: rotate(50.55deg); }
    41.6667% { transform: rotate(66.14deg); }
    50.0% { transform: rotate(66.17deg); }
    58.3333% { transform: rotate(58.25deg); }
    66.6667% { transform: rotate(47.92deg); }
    75.0% { transform: rotate(35.21deg); }
    83.3333% { transform: rotate(20.36deg); }
    91.6667% { transform: rotate(6.51deg); }
  }
  @keyframes shin-far {
    0%, 100% { transform: rotate(0deg); }
    8.3333% { transform: rotate(-12.77deg); }
    16.6667% { transform: rotate(-31.22deg); }
    25.0% { transform: rotate(-52.5deg); }
    33.3333% { transform: rotate(-74.33deg); }
    41.6667% { transform: rotate(-90.43deg); }
    50.0% { transform: rotate(-80.8deg); }
    58.3333% { transform: rotate(-59.55deg); }
    66.6667% { transform: rotate(-37.83deg); }
    75.0% { transform: rotate(-18.22deg); }
    83.3333% { transform: rotate(-3.25deg); }
    91.6667% { transform: rotate(3.63deg); }
  }

  @keyframes dust {
    0%   { opacity: 0; transform: translate(0, 0) scale(.4); }
    25%  { opacity: .5; }
    100% { opacity: 0; transform: translate(-48px, -30px) scale(1.4); }
  }
  .dust { animation: dust 1.2s ease-out infinite; }

  @keyframes swoosh {
    0%   { opacity: 0; transform: translateX(24px); }
    40%  { opacity: .8; }
    100% { opacity: 0; transform: translateX(-34px); }
  }
  .swoosh line { animation: swoosh 1.1s linear infinite; }
</style>
</head>
<body>
<svg viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3fb"/>
      <stop offset="70%" stop-color="#e6f5ff"/>
      <stop offset="100%" stop-color="#f7fcff"/>
    </linearGradient>
  </defs>

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="900" height="440" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <circle class="glow" cx="110" cy="92" r="58" fill="#ffd23f"/>
    <g class="rays" stroke="#ffce2e" stroke-width="6" stroke-linecap="round">
      <line x1="110" y1="22" x2="110" y2="42"/>
      <line x1="110" y1="142" x2="110" y2="162"/>
      <line x1="40" y1="92" x2="60" y2="92"/>
      <line x1="160" y1="92" x2="180" y2="92"/>
      <line x1="60" y1="42" x2="75" y2="57"/>
      <line x1="145" y1="127" x2="160" y2="142"/>
      <line x1="160" y1="42" x2="145" y2="57"/>
      <line x1="75" y1="127" x2="60" y2="142"/>
    </g>
    <circle cx="110" cy="92" r="38" fill="#ffd93b"/>
  </g>

  <!-- 云 -->
  <g transform="translate(980,70) scale(.9)">
    <g class="cloud cloud1" fill="#ffffff" opacity=".95">
      <ellipse cx="0" cy="0" rx="30" ry="20"/><ellipse cx="34" cy="-9" rx="26" ry="19"/>
      <ellipse cx="64" cy="2" rx="24" ry="17"/><rect x="-28" y="-6" width="110" height="26" rx="13"/>
    </g>
  </g>
  <g transform="translate(1040,120) scale(.7)">
    <g class="cloud cloud2" fill="#ffffff" opacity=".9">
      <ellipse cx="0" cy="0" rx="30" ry="20"/><ellipse cx="34" cy="-9" rx="26" ry="19"/>
      <ellipse cx="64" cy="2" rx="24" ry="17"/><rect x="-28" y="-6" width="110" height="26" rx="13"/>
    </g>
  </g>
  <g transform="translate(1000,55) scale(1.05)">
    <g class="cloud cloud3" fill="#ffffff" opacity=".85">
      <ellipse cx="0" cy="0" rx="30" ry="20"/><ellipse cx="34" cy="-9" rx="26" ry="19"/>
      <ellipse cx="64" cy="2" rx="24" ry="17"/><rect x="-28" y="-6" width="110" height="26" rx="13"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M -40 442 Q 130 296 305 442 Z" fill="#b7e3a8"/>
  <path d="M 420 442 Q 600 276 865 442 Z" fill="#a3d795"/>

  <!-- 草地 -->
  <rect x="0" y="418" width="900" height="24" fill="#8ed07a"/>
  <rect x="0" y="418" width="900" height="4" fill="#79bd66"/>

  <!-- 速度线 -->
  <g class="swoosh" stroke="#9fc8e8" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="300" x2="212" y2="300"/>
    <line x1="110" y1="340" x2="180" y2="340" style="animation-delay:.35s"/>
    <line x1="160" y1="255" x2="205" y2="255" style="animation-delay:.7s"/>
  </g>

  <!-- ============ 马路 ============ -->
  <rect x="0" y="440" width="900" height="80" fill="#49525c"/>
  <rect x="0" y="440" width="900" height="5" fill="#5d6773"/>
  <g class="road-move">
    <g fill="#ffffff" opacity=".75">
      <rect x="-40" y="486" width="120" height="10" rx="5"/>
      <rect x="200" y="486" width="120" height="10" rx="5"/>
      <rect x="440" y="486" width="120" height="10" rx="5"/>
      <rect x="680" y="486" width="120" height="10" rx="5"/>
      <rect x="920" y="486" width="120" height="10" rx="5"/>
    </g>
    <g fill="#39414a">
      <ellipse cx="60"  cy="462" rx="9" ry="4"/>
      <ellipse cx="330" cy="505" rx="11" ry="5"/>
      <ellipse cx="560" cy="458" rx="8" ry="3.5"/>
      <ellipse cx="810" cy="502" rx="10" ry="4"/>
    </g>
  </g>

  <!-- 路边景物（与马路同步移动） -->
  <g class="road-move">
    <g stroke="#4f9b3d" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 36 438 L 30 424"/><path d="M 40 438 L 40 420"/><path d="M 44 438 L 50 426"/>
      <path d="M 156 438 L 150 424"/><path d="M 160 438 L 160 420"/><path d="M 164 438 L 170 426"/>
      <path d="M 276 438 L 270 424"/><path d="M 280 438 L 280 420"/><path d="M 284 438 L 290 426"/>
      <path d="M 396 438 L 390 424"/><path d="M 400 438 L 400 420"/><path d="M 404 438 L 410 426"/>
      <path d="M 636 438 L 630 424"/><path d="M 640 438 L 640 420"/><path d="M 644 438 L 650 426"/>
      <path d="M 756 438 L 750 424"/><path d="M 760 438 L 760 420"/><path d="M 764 438 L 770 426"/>
      <path d="M 876 438 L 870 424"/><path d="M 880 438 L 880 420"/><path d="M 884 438 L 890 426"/>
    </g>
    <g>
      <rect x="118" y="412" width="5" height="26" fill="#8a5a3b"/>
      <circle cx="120" cy="404" r="17" fill="#5aa84d"/>
      <ellipse cx="358" cy="430" rx="15" ry="10" fill="#5aa84d"/>
      <rect x="598" y="416" width="5" height="22" fill="#8a5a3b"/>
      <circle cx="600" cy="409" r="14" fill="#5aa84d"/>
    </g>
  </g>

  <!-- 影子 -->
  <ellipse cx="430" cy="444" rx="200" ry="10" fill="#000000" opacity=".16"/>

  <!-- 尘土 -->
  <g fill="#c9c2b4">
    <circle class="dust" cx="266" cy="428" r="7"/>
    <circle class="dust" cx="258" cy="432" r="9" style="animation-delay:-.4s"/>
    <circle class="dust" cx="262" cy="424" r="6" style="animation-delay:-.8s"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <!-- 后轮 -->
  <g>
    <circle cx="300" cy="370" r="70" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="300" cy="370" r="57" fill="none" stroke="#b9c0c7" stroke-width="4"/>
    <g class="wheel-spin wheel-rear" stroke="#cfd6dd" stroke-width="2.5">
      <line x1="314.0" y1="370.0" x2="356.0" y2="370.0"/>
      <line x1="312.1" y1="377.0" x2="348.5" y2="398.0"/>
      <line x1="307.0" y1="382.1" x2="328.0" y2="418.5"/>
      <line x1="300.0" y1="384.0" x2="300.0" y2="426.0"/>
      <line x1="293.0" y1="382.1" x2="272.0" y2="418.5"/>
      <line x1="287.9" y1="377.0" x2="251.5" y2="398.0"/>
      <line x1="286.0" y1="370.0" x2="244.0" y2="370.0"/>
      <line x1="287.9" y1="363.0" x2="251.5" y2="342.0"/>
      <line x1="293.0" y1="357.9" x2="272.0" y2="321.5"/>
      <line x1="300.0" y1="356.0" x2="300.0" y2="314.0"/>
      <line x1="307.0" y1="357.9" x2="328.0" y2="321.5"/>
      <line x1="312.1" y1="363.0" x2="348.5" y2="342.0"/>
    </g>
    <circle cx="300" cy="370" r="9" fill="#8a949e" stroke="#3a414a" stroke-width="3"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="560" cy="370" r="70" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="560" cy="370" r="57" fill="none" stroke="#b9c0c7" stroke-width="4"/>
    <g class="wheel-spin wheel-front" stroke="#cfd6dd" stroke-width="2.5">
      <line x1="574.0" y1="370.0" x2="616.0" y2="370.0"/>
      <line x1="572.1" y1="377.0" x2="608.5" y2="398.0"/>
      <line x1="567.0" y1="382.1" x2="588.0" y2="418.5"/>
      <line x1="560.0" y1="384.0" x2="560.0" y2="426.0"/>
      <line x1="553.0" y1="382.1" x2="532.0" y2="418.5"/>
      <line x1="547.9" y1="377.0" x2="511.5" y2="398.0"/>
      <line x1="546.0" y1="370.0" x2="504.0" y2="370.0"/>
      <line x1="547.9" y1="363.0" x2="511.5" y2="342.0"/>
      <line x1="553.0" y1="357.9" x2="532.0" y2="321.5"/>
      <line x1="560.0" y1="356.0" x2="560.0" y2="314.0"/>
      <line x1="567.0" y1="357.9" x2="588.0" y2="321.5"/>
      <line x1="572.1" y1="363.0" x2="608.5" y2="342.0"/>
    </g>
    <circle cx="560" cy="370" r="9" fill="#8a949e" stroke="#3a414a" stroke-width="3"/>
  </g>

  <!-- 飞轮与链条 -->
  <circle cx="300" cy="370" r="11" fill="#8a949e" stroke="#3a414a" stroke-width="2.5"/>
  <line x1="300" y1="361" x2="430" y2="352" stroke="#3a414a" stroke-width="3"/>
  <line x1="300" y1="379" x2="430" y2="388" stroke="#3a414a" stroke-width="3"/>

  <!-- 远侧腿（在车架后面） -->
  <g class="thigh-far" stroke-linecap="round" fill="none">
    <line x1="382" y1="268" x2="436.8" y2="256.3" stroke="#5c3600" stroke-width="13"/>
    <line x1="382" y1="268" x2="436.8" y2="256.3" stroke="#cf8a12" stroke-width="9"/>
    <g class="shin-far">
      <line x1="436.8" y1="256.3" x2="430" y2="342" stroke="#5c3600" stroke-width="13"/>
      <line x1="436.8" y1="256.3" x2="430" y2="342" stroke="#cf8a12" stroke-width="9"/>
    </g>
  </g>

  <!-- 远侧曲柄、脚踏、脚掌 -->
  <g class="crank">
    <line x1="430" y1="370" x2="430" y2="342" stroke="#556069" stroke-width="7" stroke-linecap="round"/>
    <path d="M 417 337 L 442 337 L 448 343 L 440 349 L 419 347 Z" fill="#cf8a12" stroke="#7a4a00" stroke-width="2"
          class="counter" style="transform-origin:430px 342px"/>
    <rect x="417" y="338" width="26" height="9" rx="4" fill="#39414a"
          class="counter" style="transform-origin:430px 342px"/>
  </g>

  <!-- 车架 -->
  <g stroke="#e74c3c" stroke-linecap="round" fill="none">
    <line x1="300" y1="370" x2="430" y2="370" stroke-width="9"/>
    <line x1="300" y1="370" x2="375" y2="270" stroke-width="9"/>
    <line x1="430" y1="370" x2="375" y2="270" stroke-width="9"/>
    <line x1="375" y1="270" x2="514" y2="256" stroke-width="9"/>
    <line x1="430" y1="370" x2="524" y2="292" stroke-width="9"/>
    <line x1="514" y1="254" x2="524" y2="292" stroke-width="13"/>
    <line x1="524" y1="292" x2="560" y2="370" stroke-width="8"/>
  </g>

  <!-- 车座与车把 -->
  <line x1="375" y1="272" x2="368" y2="250" stroke="#3a414a" stroke-width="7"/>
  <ellipse cx="364" cy="247" rx="25" ry="8" fill="#2f3640" transform="rotate(-8 364 247)"/>
  <path d="M 514 254 L 511 243 C 509 236 503 233 496 234 L 484 237" stroke="#2f3640" stroke-width="7" fill="none" stroke-linecap="round"/>
  <line x1="499" y1="234" x2="484" y2="237" stroke="#e67e22" stroke-width="12" stroke-linecap="round"/>

  <!-- 近侧曲柄、链轮、脚踏、脚掌 -->
  <g class="crank">
    <circle cx="430" cy="370" r="19" fill="none" stroke="#3a414a" stroke-width="4"/>
    <circle cx="430" cy="370" r="7" fill="#8a949e" stroke="#3a414a" stroke-width="2.5"/>
    <line x1="430" y1="370" x2="430" y2="398" stroke="#556069" stroke-width="8" stroke-linecap="round"/>
    <path d="M 414 393 L 442 393 L 450 399 L 442 406 L 416 404 Z" fill="#f6a821" stroke="#8a5b00" stroke-width="2"
          class="counter" style="transform-origin:430px 398px"/>
    <rect x="416" y="394" width="28" height="9" rx="4" fill="#2f3640"
          class="counter" style="transform-origin:430px 398px"/>
  </g>

  <!-- 近侧腿 -->
  <g class="thigh-near" stroke-linecap="round" fill="none">
    <line x1="390" y1="262" x2="409.6" y2="314.4" stroke="#7a4a00" stroke-width="13"/>
    <line x1="390" y1="262" x2="409.6" y2="314.4" stroke="#f6a821" stroke-width="9"/>
    <g class="shin-near">
      <line x1="409.6" y1="314.4" x2="430" y2="398" stroke="#7a4a00" stroke-width="13"/>
      <line x1="409.6" y1="314.4" x2="430" y2="398" stroke="#f6a821" stroke-width="9"/>
    </g>
  </g>

  <!-- ============ 鹈鹕 ============ -->
  <g class="rider">
    <!-- 尾羽 -->
    <path d="M 285 175 C 258 162 240 166 232 178 C 246 182 252 190 258 200 C 266 192 276 184 285 182 Z"
          fill="#fdfdfd" stroke="#3a3a3a" stroke-width="4" stroke-linejoin="round"/>
    <!-- 身体 -->
    <ellipse cx="348" cy="208" rx="78" ry="62" fill="#fdfdfd" stroke="#3a3a3a" stroke-width="4"
             transform="rotate(-10 348 208)"/>
    <!-- 脖子 -->
    <path d="M 398 165 C 420 132 442 112 468 104" fill="none" stroke="#3a3a3a" stroke-width="46" stroke-linecap="round"/>
    <path d="M 398 165 C 420 132 442 112 468 104" fill="none" stroke="#fdfdfd" stroke-width="36" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="476" cy="100" r="30" fill="#fdfdfd" stroke="#3a3a3a" stroke-width="4"/>
    <!-- 喙 -->
    <path d="M 494 86 C 528 88 562 97 590 103 C 594 104 594 108 590 109 C 558 111 522 109 496 105 Z"
          fill="#f7b733" stroke="#3a3a3a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 497 103 C 512 141 556 143 589 108 C 556 121 522 119 497 103 Z"
          fill="#ffcf5c" stroke="#3a3a3a" stroke-width="3" stroke-linejoin="round"/>
    <!-- 眼睛 -->
    <circle cx="488" cy="92" r="5" fill="#2b2b2b"/>
    <circle cx="490" cy="90" r="1.8" fill="#ffffff"/>
    <!-- 头盔 -->
    <path d="M 447 88 C 445 58 507 54 511 85 C 512 90 507 93 502 90 C 488 82 466 84 455 93 C 451 95 448 92 447 88 Z"
          fill="#3aa6dd" stroke="#2b7fb0" stroke-width="3"/>
    <path d="M 508 84 L 523 88 C 525 92 520 94 514 93 Z" fill="#3aa6dd" stroke="#2b7fb0" stroke-width="3"/>
    <line x1="470" y1="68" x2="474" y2="80" stroke="#2b7fb0" stroke-width="3" stroke-linecap="round"/>
    <line x1="486" y1="66" x2="488" y2="79" stroke="#2b7fb0" stroke-width="3" stroke-linecap="round"/>
    <path d="M 456 92 C 458 106 462 116 468 122" stroke="#2b7fb0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 翅膀扶车把 -->
    <path d="M 362 176 C 396 172 438 196 484 230 C 494 237 490 248 478 247 C 448 245 412 238 376 219 C 352 206 346 184 362 176 Z"
          fill="#f4f6f8" stroke="#3a3a3a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 392 196 C 420 210 448 224 470 236" stroke="#d8dee4" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 380 206 C 404 217 430 229 452 239" stroke="#d8dee4" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
