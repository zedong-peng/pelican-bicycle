<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf7f5">
  <title>&#40520;&#40533;&#30340;&#20828;&#39118;&#26102;&#38388;</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "PingFang SC", sans-serif; color: #243d3c; background: #edf7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
    header { width: min(1320px, 100%); margin: 0 auto; padding: 32px 40px 0; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .wordmark { display: flex; align-items: center; gap: 12px; }
    .mark { width: 30px; height: 30px; border: 2px solid #243d3c; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
    h1 { margin: 0; font-size: 18px; line-height: 1.5; font-weight: 600; }
    .edition { font-size: 11px; color: #637d78; }
    main { flex: 1; display: grid; align-items: center; position: relative; width: 100%; }
    .scene { display: block; width: min(1440px, 100%); height: auto; max-height: calc(100svh - 178px); margin: 0 auto; overflow: visible; }
    footer { width: min(1320px, 100%); padding: 0 40px 28px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .caption { display: flex; align-items: center; gap: 13px; }
    .caption-index { color: #d67454; font-size: 12px; }
    .caption-title { font-size: 13px; }
    .caption-subtitle { margin-top: 5px; font-size: 10px; color: #69827c; }
    .controls { display: flex; gap: 18px; align-items: center; }
    .toggle { border: 1px solid #b5c9c2; border-radius: 6px; min-width: 82px; height: 38px; padding: 0 16px; background: transparent; color: #243d3c; cursor: pointer; }
    .toggle:hover { background: #dceee7; border-color: #789c8c; }
    .toggle:focus-visible, input:focus-visible { outline: 3px solid #d67454; outline-offset: 4px; }
    .speed { display: flex; align-items: center; gap: 9px; font-size: 11px; color: #637d78; }
    input[type="range"] { width: 82px; accent-color: #3b7766; cursor: pointer; }
    output { width: 29px; font-variant-numeric: tabular-nums; }
    .ink { stroke: #293e3c; stroke-linecap: round; stroke-linejoin: round; }
    @media (min-width: 1600px) { .scene { max-height: 860px; } }
    @media (max-width: 600px) {
      header { padding: 24px 22px 0; }
      h1 { font-size: 15px; }
      .edition { font-size: 9px; }
      .scene { width: 150%; max-width: none; max-height: none; margin-left: -25%; }
      footer { padding: 10px 22px 25px; align-items: flex-start; }
      .caption { gap: 8px; }
      .caption-title { font-size: 12px; }
      .caption-subtitle { font-size: 9px; }
      .controls { flex-direction: column; align-items: flex-end; gap: 12px; }
      .toggle { height: 36px; }
      input[type="range"] { width: 66px; }
    }
    @media (max-height: 500px) and (min-width: 601px) {
      header { padding-top: 14px; }
      .scene { max-height: calc(100svh - 114px); }
      footer { padding-bottom: 12px; }
    }
  </style>
</head>
<body>

    <header>

              </g>
              <g transform="translate(350 500)"><g id="rear-wheel"><use href="#spokes"/></g></g>
              <g transform="translate(710 500)"><g id="front-wheel"><use href="#spokes"/></g></g>
              <g class="ink" fill="none" stroke-width="5">

                <path d="M255 443L350 500L433 437M630 433L710 500L800 448" stroke="#75948b" stroke-width="2"/>
              </g>

                <path d="M350 500L462 360L512 500Z" stroke="#af5849" stroke-width="10"/>
                <path d="M462 360H650L512 500Z" stroke="#e38368" stroke-width="12"/>

                <path d="M636 327L662 389L710 500" stroke="#e38368" stroke-width="11"/>
                <path d="M641 321L630 294L656 282H680Q698 282 698 294Q698 307 683 308" stroke="#314c47" stroke-width="8"/>
                <path d="M675 282H682Q698 282 698 294Q698 305 687 307" stroke="#a37551" stroke-width="10"/>
                <path d="M650 295Q686 361 681 411" stroke-width="2"/>
                <path d="M462 360L452 328" stroke="#6d8a7c" stroke-width="8"/>
                <path d="M427 326Q451 323 478 329" stroke="#493e34" stroke-width="13"/>
                <path d="M348 490L511 477A25 25 0 0 1 512 523L348 510A10 10 0 0 1 348 490Z" stroke="#566e61" stroke-width="3"/>
                <circle cx="512" cy="500" r="25" fill="#c6cec0" stroke-width="3"/>
                <circle cx="512" cy="500" r="18" stroke="#899c8c" stroke-width="2" stroke-dasharray="2 7"/>
                <circle cx="350" cy="500" r="7" fill="#d5d9c5" stroke-width="3"/>
                <circle cx="710" cy="500" r="7" fill="#d5d9c5" stroke-width="3"/>
              </g>
              <g id="crank" class="ink" stroke-width="5"><path d="M-29 0H29" stroke="#52675c"/><circle r="5" fill="#f4eedb" stroke-width="2"/></g>

              <g id="rider">
                <g class="ink" stroke-width="3">

                  <path d="M493 201C511 226 508 268 478 289C445 312 398 309 365 297C380 328 432 338 472 329C514 321 538 298 543 261C545 239 554 216 563 203C540 217 514 219 493 201Z" fill="#e1e8d6" stroke="none"/>
                  <path d="M374 272C403 255 450 266 477 288C464 308 423 321 382 302L398 297L377 289L391 285Z" fill="#f0f0dc"/>
                  <path d="M400 278Q430 279 454 292M401 291Q424 295 441 297" fill="none" stroke="#bac6b3" stroke-width="2"/>
                  <path d="M548 126Q546 114 554 109M539 124Q533 111 540 105M531 126Q521 117 525 111" fill="none"/>

                  <path d="M583 151L753 166Q760 168 752 174L600 188L577 170Z" fill="#edb456"/>

                  <path d="M598 180C616 207 645 217 673 205" stroke="#dca35d" stroke-width="2" fill="none"/>
                  <path d="M586 166L744 171" fill="none" stroke="#bb7d3f" stroke-width="2"/>

                </g>

                  <path id="scarf-tail" d="M511 230C475 218 447 224 423 211L429 228L416 236C449 243 476 230 510 242Z" fill="#367e72"/>

                  <path d="M499 229L493 239L501 247L510 237Z" fill="#66a18a"/>

    </main>
    <footer>
      <div class="caption"><span class="caption-index">01</span><div><div class="caption-title">&#27839;&#30528;&#28023;&#39118;&#65292;&#24930;&#24930;&#39569;&#12290;</div><div class="caption-subtitle">THE COASTAL RIDE</div></div></div>
      <div class="controls">
        <button class="toggle" id="toggle" type="button" aria-label="Pause animation">&#26242;&#20572;</button>
        <label class="speed" for="speed"><span>&#36895;&#24230;</span><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speed-value" for="speed">1x</output></label>
      </div>
    </footer>
  </div>
  <script>
    (() => {
      'use strict';
      const el = id => document.getElementById(id);
      const parts = Object.fromEntries(['rear-wheel', 'front-wheel', 'crank', 'rider', 'near-leg-path', 'near-leg-color', 'far-leg-path', 'near-pedal', 'far-pedal', 'road', 'plants', 'clouds', 'wind', 'shadow', 'scarf-tail'].map(id => [id, el(id)]));
      const toggle = el('toggle');
      const speedInput = el('speed');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let previous = null;
      let frameId = null;
      const setTransform = (name, value) => parts[name].setAttribute('transform', value);

      // Solve a two-segment leg so each foot stays attached to its moving pedal.
      function legPath(hipX, hipY, footX, footY) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.hypot(dx, dy);
        const thigh = 110;
        const shin = 109;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hipX + dx / distance * along + dy / distance * bend;
        const kneeY = hipY + dy / distance * along - dx / distance * bend;
        return `M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY}`;
      }

      function draw(time) {
        const angle = time * Math.PI * 2 / 1.65;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 1.7;
        const roadDistance = angle * 102 * 1.55;
        setTransform('rear-wheel', `rotate(${degrees * 1.55})`);
        setTransform('front-wheel', `rotate(${degrees * 1.55})`);
        setTransform('crank', `translate(512 500) rotate(${degrees})`);
        setTransform('rider', `translate(0 ${bob})`);
        const x = Math.cos(angle) * 29;
        const y = Math.sin(angle) * 29;
        const near = legPath(471, 329 + bob, 512 + x, 492 + y);
        parts['near-leg-path'].setAttribute('d', near);
        parts['near-leg-color'].setAttribute('d', near);
        parts['far-leg-path'].setAttribute('d', legPath(461, 326 + bob, 512 - x, 492 - y));
        setTransform('near-pedal', `translate(${512 + x} ${493 + y})`);
        setTransform('far-pedal', `translate(${512 - x} ${493 - y})`);
        setTransform('road', `translate(${-roadDistance % 1200} 0)`);
        setTransform('plants', `translate(${-roadDistance % 1200} 0)`);
        setTransform('clouds', `translate(${-Math.sin(time * .075) * 45} 0)`);
        parts.wind.setAttribute('opacity', String(.4 + Math.sin(angle) * .2));
        setTransform('wind', `translate(${Math.sin(angle) * 9} 0)`);
        parts.shadow.setAttribute('rx', String(259 + bob * 2));
        const flutter = Math.sin(angle * 2.3) * 5;
        parts['scarf-tail'].setAttribute('d', `M511 230C475 ${218 + flutter} 447 ${224 - flutter} 423 ${211 + flutter}L429 ${228 + flutter}L416 ${236 + flutter}C449 ${243 - flutter} 476 ${230 + flutter} 510 242Z`);
      }

      function tick(now) {
        frameId = null;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw(elapsed);
        frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        toggle.textContent = playing ? '\u6682\u505c' : '\u64ad\u653e';
        toggle.setAttribute('aria-label', playing ? '\u6682\u505c\u52a8\u753b' : '\u64ad\u653e\u52a8\u753b');
        previous = null;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = playing && !document.hidden ? requestAnimationFrame(tick) : null;
      }

      toggle.addEventListener('click', () => { playing = !playing; syncPlayback(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        el('speed-value').value = `${speed}x`;
      });
      reducedMotion.addEventListener('change', event => { playing = !event.matches; syncPlayback(); });
      document.addEventListener('visibilitychange', syncPlayback);
      draw(0);
      syncPlayback();
    })();
  </script>
</body>
</html>
