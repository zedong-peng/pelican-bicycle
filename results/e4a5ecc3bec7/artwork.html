<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;gap:14px;padding:22px;
    background:radial-gradient(120% 110% at 50% 0%,#eef8ff 0%,#dcecf8 45%,#c9dff0 100%);
    font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b3a42;
  }
  .stage{
    width:min(96vw,1120px);aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#bfe4fb;
    box-shadow:0 30px 60px -26px rgba(18,62,92,.5),0 2px 0 rgba(255,255,255,.85) inset,0 0 0 1px rgba(255,255,255,.55);
  }
  svg{display:block;width:100%;height:100%}
  /* ---- cartoon line art ---- */
  .frame-o,.crank-o,.limb-o{fill:none;stroke:#33454e;stroke-linecap:round;stroke-linejoin:round}
  .frame-o path{stroke-width:13.5}
  .frame-i path{stroke:#cf4a30;stroke-width:7.6;stroke-linecap:round;stroke-linejoin:round}
  .crank-o{stroke-width:17}
  .crank-i{fill:none;stroke:#cf4a30;stroke-width:11;stroke-linecap:round}
  .limb-o{stroke-width:18}
  .limb-i{fill:none;stroke:#f2a35a;stroke-width:12;stroke-linecap:round}
  .dark-leg .limb-i{stroke:#c2813d}
  .shoe,.shoe-f{stroke:#33454e;stroke-width:3.4;stroke-linejoin:round}
  .shoe{fill:#41586a}
  .shoe-f{fill:#2c3d49}
  .pedal,.pedal-f{stroke:#33454e;stroke-width:3.2}
  .pedal{fill:#eef3f7}
  .pedal-f{fill:#9db0bc}
  .cap{margin:0;opacity:.72;font-size:14px;letter-spacing:.04em}
</style>
