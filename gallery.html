<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Bicycle / 鹈鹕骑自行车</title>
  <style>
:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242624; background: #fafbf9; letter-spacing: 0; font-synthesis: none; }
* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-underline-offset: 4px; }
header, main, footer { max-width: 1520px; margin: auto; padding: 0 48px; }
header { height: 86px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #dedfd9; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 750; text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 32px; height: 32px; background: #dc4938; color: white; font: italic 24px Georgia, serif; border-radius: 50%; }
nav { display: flex; gap: 28px; align-items: center; font-size: 13px; }
nav a { text-decoration: none; }
nav .contribute { color: #bc3527; }
.heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding: 40px 0 28px; }
.eyebrow { font: 11px ui-monospace, monospace; color: #b53d2e; margin: 0 0 14px; }
h1 { font-size: 44px; font-weight: 650; line-height: 1.2; margin: 0; }
.heading-aside { text-align: right; color: #737770; font-size: 12px; }
.heading-aside strong { display: block; font: 32px Georgia, serif; color: #30392f; margin-bottom: 6px; }
.prompt { display: flex; align-items: baseline; gap: 22px; padding: 20px 0; border-top: 1px solid #dedfd9; border-bottom: 1px solid #dedfd9; }
.prompt-label { flex-shrink: 0; font: 11px ui-monospace, monospace; color: #9b4234; }
blockquote { margin: 0; line-height: 1.8; font-size: 14px; color: #555d54; }
form { display: grid; grid-template-columns: 2fr 1fr 1.4fr 1.4fr auto; gap: 16px; align-items: end; padding: 26px 0 30px; }
label { display: grid; gap: 9px; min-width: 0; font-size: 11px; font-weight: 500; color: #72776e; }
.facet-name { display: flex; align-items: baseline; gap: 6px; }
.facet-count { font: 10px ui-monospace, monospace; color: #a0a69a; }
.facet-box { position: relative; display: block; min-width: 0; }
select, button { min-width: 0; border: 1px solid #d7dbd2; border-radius: 4px; padding: 0 12px; font: inherit; background: transparent; color: #292f28; }
select { width: 100%; font-size: 13px; background: #fff; }
.filter-actions { display: grid; gap: 8px; }
select[multiple] { height: 144px; padding: 6px; scrollbar-width: thin; scrollbar-color: #c3c9bd transparent; }
select[multiple]::-webkit-scrollbar { width: 9px; }
select[multiple]::-webkit-scrollbar-track { background: transparent; }
select[multiple]::-webkit-scrollbar-thumb { background: #c3c9bd; border: 2px solid transparent; border-radius: 5px; background-clip: padding-box; }
select[multiple]::-webkit-scrollbar-thumb:hover { background: #aab2a3; background-clip: padding-box; }
.facet-box::after { content: ""; position: absolute; left: 1px; right: 10px; bottom: 1px; height: 24px; pointer-events: none; opacity: 0; transition: opacity .15s; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.96)); }
.facet-box.has-more::after { opacity: 1; }
select option { padding: 5px 6px; }
button { cursor: pointer; font-size: 12px; }
button:hover { background: #eef1ea; }
:focus-visible { outline: 2px solid #c24432; outline-offset: 4px; }
.collection-heading { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; }
.collection-heading h2 { margin: 0; font-size: 13px; font-weight: 600; }
#count { margin: 0; font: 11px ui-monospace, monospace; color: #777c73; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px 20px; align-items: start; }
article { overflow: hidden; border: 1px solid #dcdfd6; border-radius: 6px; background: white; min-width: 0; transition: border-color .2s; }
article:hover { border-color: #a9b6a3; }
.preview { position: relative; background: #eff2eb; }
iframe { display: block; width: 100%; aspect-ratio: 16 / 10; border: 0; background: #eff2eb; }
.info { padding: 18px 20px 0; border-top: 1px solid #e1e5de; }
.work-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
.index { font: 11px ui-monospace, monospace; color: #a5aa9f; flex-shrink: 0; }
h2 { font-size: 19px; font-weight: 600; margin: 0; overflow-wrap: anywhere; line-height: 1.4; }
dl { display: grid; grid-template-columns: .7fr 1.3fr 1fr; gap: 10px; margin: 0 0 18px; }
dl div { min-width: 0; }
dt { font: 10px ui-monospace, monospace; color: #84897e; margin-bottom: 7px; text-transform: uppercase; }
dd { margin: 0; font-size: 12px; color: #46533f; overflow-wrap: anywhere; }
.work-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid #edf0e8; }
.work-footer a { font-size: 12px; }
.expand { border: 0; height: 32px; padding: 0 9px; margin-right: -9px; color: #b24030; white-space: nowrap; }
footer { border-top: 1px solid #dedfd9; margin-top: 48px; padding-top: 24px; padding-bottom: 32px; font-size: 11px; color: #81877b; display: flex; justify-content: space-between; gap: 16px; }
#empty { padding: 72px 0; text-align: center; color: #777c73; }
dialog { width: min(1200px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid #d7dbd2; border-radius: 6px; background: #fafbf9; }
dialog::backdrop { background: #172014b3; }
.dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 20px; }
.dialog-heading h2 { font-size: 15px; }
dialog iframe { height: min(72dvh, 750px); aspect-ratio: auto; }
body:has(dialog[open]) { overflow: hidden; }
[hidden] { display: none !important; }
@media (max-width: 900px) { header, main, footer { padding-left: 24px; padding-right: 24px; } .info { padding: 18px 18px 0; } .gallery { gap: 24px 18px; } h2 { font-size: 17px; } }
@media (max-width: 680px) { header, main, footer { padding-left: 18px; padding-right: 18px; } header { height: 72px; } .brand { font-size: 14px; gap: 8px; } .brand-mark { width: 26px; height: 26px; font-size: 20px; } nav { gap: 16px; font-size: 12px; } nav .github { display: none; } .heading { padding: 30px 0 24px; align-items: center; } h1 { font-size: 30px; } .heading-aside strong { font-size: 24px; } .eyebrow { font-size: 9px; } .prompt { display: block; padding: 16px 0; } blockquote { margin-top: 9px; font-size: 12px; } form { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; padding: 22px 0; } .filter-actions { grid-column: 1 / -1; } select[multiple] { height: 118px; } .gallery { grid-template-columns: minmax(0, 1fr); } footer { flex-wrap: wrap; } dialog iframe { height: 60dvh; } }
  </style>
</head>
<body>
  <header><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">p</span>Pelican Bicycle</a><nav><a class="github" href="https://github.com/zedong-peng/pelican-bicycle">GitHub ↗</a><a class="contribute" href="https://github.com/zedong-peng/pelican-bicycle/blob/main/CONTRIBUTING.md">提交作品 ↗</a></nav></header>
  <main>
    <div class="heading"><div><p class="eyebrow">THE PELICAN COLLECTION / 001</p><h1>鹈鹕骑自行车</h1></div><div class="heading-aside"><strong id="total"></strong>份不同的想象</div></div>
    <div class="prompt"><span class="prompt-label">PROMPT / V1</span><blockquote><!-- PROMPT --></blockquote></div>
    <form aria-label="筛选作品">
      <label><span class="facet-name">Model<span class="facet-count" data-count-for="model"></span></span><span class="facet-box"><select name="model" multiple size="5"></select></span></label>
      <label><span class="facet-name">Effort<span class="facet-count" data-count-for="effort"></span></span><span class="facet-box"><select name="effort" multiple size="5"></select></span></label>
      <label><span class="facet-name">Provider<span class="facet-count" data-count-for="provider"></span></span><span class="facet-box"><select name="provider" multiple size="5"></select></span></label>
      <label><span class="facet-name">Harness<span class="facet-count" data-count-for="harness"></span></span><span class="facet-box"><select name="harness" multiple size="5"></select></span></label>
      <div class="filter-actions"><button type="button" id="copy-link">复制链接</button><button type="reset">重置</button></div>
    </form>
    <div class="collection-heading"><h2>全部作品</h2><p id="count" aria-live="polite"></p></div>
    <section class="gallery" aria-label="作品"><!-- RESULTS --></section>
    <p id="empty" hidden>没有匹配的作品。</p>
  </main>
  <footer><span>PELICAN BICYCLE · 一个 prompt，多种结果。</span><a href="https://github.com/zedong-peng/pelican-bicycle/blob/main/README.md">记录规范与来源 ↗</a></footer>
  <dialog aria-labelledby="viewer-title"><div class="dialog-heading"><h2 id="viewer-title"></h2><button type="button" id="close-viewer">关闭</button></div><iframe title="作品放大预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></dialog>
<script>
const cards = [...document.querySelectorAll("article")];
document.querySelector("#total").textContent = String(cards.length).padStart(2, "0");
const form = document.querySelector("form");
const selects = [...form.querySelectorAll("select")];
const applied = Object.fromEntries(selects.map(select => [select.name, []]));
const valuesFor = (select, state) => [...new Set(cards.filter(card => selects.every(other => {
  const values = state[other.name] || [];
  return other === select || !values.length || values.includes(card.dataset[other.name]);
})).map(card => card.dataset[select.name]))].sort();
function matches(card, state) { return selects.every(select => {
  const values = state[select.name] || [];
  return !values.length || values.includes(card.dataset[select.name]);
}); }
function updateOptions() {
  const draft = Object.fromEntries(selects.map(select => [select.name, [...select.selectedOptions].map(option => option.value)]));
  for (const select of selects) {
    const values = valuesFor(select, draft);
    select.replaceChildren(...values.map(value => new Option(value, value)));
    for (const value of draft[select.name]) { const option = [...select.options].find(item => item.value === value); if (option) option.selected = true; }
    document.querySelector(`[data-count-for="${select.name}"]`).textContent = `· ${values.length}`;
  }
  updateScrollHints();
}
function updateScrollHints() {
  for (const select of selects) {
    const overflow = select.scrollHeight - select.clientHeight;
    select.parentElement.classList.toggle("has-more", overflow > 4 && overflow - select.scrollTop > 4);
  }
}
function render() {
  let visible = 0;
  for (const card of cards) {
    card.hidden = !matches(card, applied);
    if (!card.hidden) visible++;
  }
  document.querySelector("#count").textContent = `${visible} / ${cards.length} 作品`;
  document.querySelector("#empty").hidden = visible !== 0;
}
form.addEventListener("submit", event => event.preventDefault());
function writeURL() {
  const params = new URLSearchParams();
  for (const select of selects) for (const value of applied[select.name]) params.append(select.name, value);
  const query = params.toString();
  try {
    history.replaceState(null, "", query ? `?${query}` : location.pathname);
  } catch {
    // file:// 本地预览不支持 replaceState，忽略即可。
  }
}
function readURL() {
  const params = new URLSearchParams(location.search);
  for (const select of selects) {
    const known = new Set(cards.map(card => card.dataset[select.name]));
    const kept = [];
    for (const raw of params.getAll(select.name)) {
      if (known.has(raw)) { if (!kept.includes(raw)) kept.push(raw); continue; }
      for (const part of raw.split(",")) {
        const value = part.trim();
        if (known.has(value) && !kept.includes(value)) kept.push(value);
      }
    }
    applied[select.name] = kept;
  }
}
function apply() {
  Object.assign(applied, Object.fromEntries(selects.map(select => [select.name, [...select.selectedOptions].map(option => option.value)])));
  updateOptions(); render(); writeURL();
}
for (const select of selects) {
  select.addEventListener("change", apply);
  select.addEventListener("scroll", updateScrollHints);
  // Plain click on an already-selected option deselects it.
  select.addEventListener("mousedown", event => {
    const option = event.target.closest ? event.target.closest("option") : null;
    if (!option || option.disabled) return;
    if (option.selected) {
      event.preventDefault();
      option.selected = false;
      apply();
    }
  });
}
window.addEventListener("resize", updateScrollHints);
form.addEventListener("reset", () => { setTimeout(() => { selects.forEach(select => [...select.options].forEach(option => option.selected = false)); Object.keys(applied).forEach(name => { applied[name] = []; }); updateOptions(); render(); writeURL(); }, 0); });
const copyButton = document.querySelector("#copy-link");
copyButton.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(location.href);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = location.href;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const original = copyButton.textContent;
  copyButton.textContent = "已复制 ✓";
  setTimeout(() => { copyButton.textContent = original; }, 1500);
});
readURL();
updateOptions();
for (const select of selects) {
  for (const option of select.options) option.selected = applied[select.name].includes(option.value);
}
updateOptions(); render(); writeURL();
const viewer = document.querySelector("dialog");
const viewerFrame = viewer.querySelector("iframe");
document.querySelector(".gallery").addEventListener("click", event => {
  const button = event.target.closest(".expand");
  if (!button) return;
  const card = button.closest("article");
  document.querySelector("#viewer-title").textContent = card.querySelector("h2").textContent;
  viewerFrame.src = card.querySelector("iframe").src;
  viewer.showModal();
});
document.querySelector("#close-viewer").addEventListener("click", () => viewer.close());
viewer.addEventListener("close", () => viewerFrame.removeAttribute("src"));
viewer.addEventListener("click", event => {
  if (event.target !== viewer) return;
  const rect = viewer.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) viewer.close();
});
</script>
</body>
</html>
