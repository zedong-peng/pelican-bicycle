<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Bicycle / 鹈鹕骑自行车</title>
  <style>
:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #232824; background: #f5f6f3; letter-spacing: 0; }
* { box-sizing: border-box; }
body { margin: 0; }
a { color: #176354; text-underline-offset: 4px; }
header, main, footer { max-width: 1440px; margin: auto; padding: 24px 32px; }
header { display: flex; justify-content: space-between; gap: 20px; border-bottom: 1px solid #d8ddd7; }
.brand { font-size: 20px; font-weight: 750; text-decoration: none; color: #232824; }
nav { display: flex; gap: 24px; align-items: center; }
.heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
.eyebrow { font-size: 11px; color: #626a63; }
h1 { font-size: 36px; line-height: 1.25; margin: 12px 0 0; }
blockquote { margin: 24px 0; padding: 4px 0 4px 16px; border-left: 3px solid #cf663e; line-height: 1.8; font-size: 14px; color: #535b54; }
form { display: grid; grid-template-columns: 2fr 1fr 1.3fr 1.3fr auto; gap: 14px; align-items: end; padding-bottom: 24px; }
label { display: grid; gap: 8px; min-width: 0; font-size: 12px; font-weight: 600; }
select, button { min-width: 0; width: 100%; height: 40px; border: 1px solid #c8d0c8; border-radius: 4px; padding: 0 10px; font: inherit; background: #fff; color: #232824; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #bd5633; outline-offset: 3px; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
article { overflow: hidden; border: 1px solid #d8ddd7; border-radius: 6px; background: white; min-width: 0; }
iframe { display: block; width: 100%; aspect-ratio: 16 / 10; border: 0; background: #edf0eb; }
.info { padding: 20px; border-top: 1px solid #e1e5de; }
h2 { font-size: 19px; margin: 0 0 16px; overflow-wrap: anywhere; }
dl { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 7px 12px; margin: 0; font-size: 13px; }
dt { color: #687167; } dd { margin: 0; overflow-wrap: anywhere; }
.status { font-size: 12px; color: #865322; margin: 18px 0 12px; }
details { font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
summary { cursor: pointer; color: #176354; }
footer { border-top: 1px solid #d8ddd7; margin-top: 24px; font-size: 13px; color: #626a63; display: flex; justify-content: space-between; gap: 16px; }
[hidden] { display: none !important; }
@media (max-width: 680px) { header, main, footer { padding: 20px 16px; } header { flex-wrap: wrap; } nav { gap: 18px; font-size: 13px; } h1 { font-size: 28px; } form { grid-template-columns: repeat(2, minmax(0, 1fr)); } form button { width: auto; justify-self: start; } .gallery { grid-template-columns: minmax(0, 1fr); } footer { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header><a class="brand" href="./">Pelican Bicycle</a><nav><a href="https://github.com/zedong-peng/pelican-bicycle">GitHub ↗</a><a href="https://github.com/zedong-peng/pelican-bicycle/blob/main/CONTRIBUTING.md">提交作品 ↗</a></nav></header>
  <main>
    <div class="heading"><div><p class="eyebrow">MODEL / EFFORT / PROVIDER / HARNESS</p><h1>鹈鹕骑自行车</h1></div><p id="count" aria-live="polite"></p></div>
    <blockquote><!-- PROMPT --></blockquote>
    <form aria-label="筛选作品">
      <label>Model<select name="model"><option value="">全部</option></select></label>
      <label>Effort<select name="effort"><option value="">全部</option></select></label>
      <label>Provider<select name="provider"><option value="">全部</option></select></label>
      <label>Harness<select name="harness"><option value="">全部</option></select></label>
      <button type="reset">重置</button>
    </form>
    <section class="gallery" aria-label="作品"><!-- RESULTS --></section>
    <p id="empty" hidden>没有匹配的作品。</p>
  </main>
  <footer>一个 prompt，多种结果。<a href="https://github.com/zedong-peng/pelican-bicycle/blob/main/README.md">记录规范与来源 ↗</a></footer>
<script>
const cards = [...document.querySelectorAll("article")];
const form = document.querySelector("form");
const selects = [...form.querySelectorAll("select")];
for (const select of selects) {
  const values = [...new Set(cards.map(card => card.dataset[select.name]))].sort();
  for (const value of values) select.add(new Option(value, value));
}
function filter() {
  let visible = 0;
  for (const card of cards) {
    card.hidden = !selects.every(select => !select.value || card.dataset[select.name] === select.value);
    if (!card.hidden) visible++;
  }
  document.querySelector("#count").textContent = `${visible} / ${cards.length} 作品`;
  document.querySelector("#empty").hidden = visible !== 0;
}
form.addEventListener("change", filter);
form.addEventListener("reset", () => setTimeout(filter, 0));
form.addEventListener("submit", event => event.preventDefault());
filter();
</script>
</body>
</html>
