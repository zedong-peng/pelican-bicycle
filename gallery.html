<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Bicycle / 鹈鹕骑自行车</title>
  <style>
:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242624; background: #fafbf9; letter-spacing: 0; font-synthesis: none; }
* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-underline-offset: 4px; }
header, main, footer { max-width: 1520px; margin: auto; padding: 0 48px; }
header { height: 86px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #dedfd9; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 750; text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 32px; height: 32px; background: #dc4938; color: white; font: italic 24px Georgia, serif; border-radius: 50%; }
nav { display: flex; gap: 28px; align-items: center; font-size: 13px; }
nav a { text-decoration: none; }
nav .contribute { color: #bc3527; }
.heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding: 40px 0 28px; }
.eyebrow { font: 11px ui-monospace, monospace; color: #b53d2e; margin: 0 0 14px; }
h1 { font-size: 44px; font-weight: 650; line-height: 1.2; margin: 0; }
.heading-aside { text-align: right; color: #737770; font-size: 12px; }
.heading-aside strong { display: block; font: 32px Georgia, serif; color: #30392f; margin-bottom: 6px; }
.prompt { display: flex; align-items: flex-start; gap: 22px; padding: 20px 0; border-top: 1px solid #dedfd9; border-bottom: 1px solid #dedfd9; }
.prompt-label { flex-shrink: 0; padding-top: 5px; font: 11px ui-monospace, monospace; color: #9b4234; }
.prompt-body { flex: 1; min-width: 0; }
.prompt-note { margin: 8px 0 0; font-size: 12px; line-height: 1.7; color: #81877b; }
#copy-prompt { flex-shrink: 0; white-space: nowrap; }
blockquote { margin: 0; line-height: 1.8; font-size: 14px; color: #555d54; }
form { display: grid; grid-template-columns: 2fr 1fr 1.4fr 1.4fr auto; gap: 16px; align-items: end; padding: 26px 0 30px; }
fieldset[data-facet] { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 9px; }
legend { padding: 0; font-size: 11px; font-weight: 500; color: #72776e; }
.facet-name { display: flex; align-items: baseline; gap: 6px; }
.facet-count { font: 10px ui-monospace, monospace; color: #a0a69a; }
.check-list { position: relative; height: 144px; overflow-y: auto; background: #fff; border: 1px solid #d7dbd2; border-radius: 4px; padding: 4px; display: grid; gap: 2px; align-content: start; scrollbar-width: thin; scrollbar-color: #c3c9bd transparent; }
.check-list::-webkit-scrollbar { width: 9px; }
.check-list::-webkit-scrollbar-track { background: transparent; }
.check-list::-webkit-scrollbar-thumb { background: #c3c9bd; border: 2px solid transparent; border-radius: 5px; background-clip: padding-box; }
.check-list::-webkit-scrollbar-thumb:hover { background: #aab2a3; background-clip: padding-box; }
.check-list.has-more::after { content: ""; position: sticky; left: 0; right: 0; bottom: -4px; display: block; height: 24px; margin-top: -24px; pointer-events: none; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.96)); }
.check-item { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 5px 6px; border-radius: 3px; font-size: 13px; font-weight: 400; color: #292f28; cursor: pointer; }
.check-item:hover { background: #eef1ea; }
.check-item input { flex-shrink: 0; width: 14px; height: 14px; margin: 0; accent-color: #b24030; cursor: pointer; }
.check-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.check-empty { padding: 5px 6px; font-size: 12px; color: #a0a69a; }
.filter-actions { display: grid; gap: 8px; }
button { min-width: 0; border: 1px solid #d7dbd2; border-radius: 4px; padding: 7px 12px; font: inherit; background: transparent; color: #292f28; cursor: pointer; font-size: 12px; }
button:hover { background: #eef1ea; }
:focus-visible { outline: 2px solid #c24432; outline-offset: 4px; }
.collection-heading { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; }
.collection-heading h2 { margin: 0; font-size: 13px; font-weight: 600; }
#count { margin: 0; font: 11px ui-monospace, monospace; color: #777c73; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 20px; align-items: start; }
article { overflow: hidden; border: 1px solid #dcdfd6; border-radius: 6px; background: white; min-width: 0; transition: border-color .2s; }
article:hover { border-color: #a9b6a3; }
.preview { position: relative; background: #eff2eb; }
iframe { display: block; width: 100%; aspect-ratio: 16 / 10; border: 0; background: #eff2eb; }
.info { padding: 12px 14px 0; border-top: 1px solid #e1e5de; }
.meta { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; min-width: 0; font-size: 12px; line-height: 1.5; color: #51564f; }
.index { font: 11px ui-monospace, monospace; color: #a5aa9f; flex-shrink: 0; }
.meta-lines { display: grid; gap: 2px; min-width: 0; flex: 1; }
.meta-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #edf0e8; }
.work-footer a { font-size: 12px; }
.expand { border: 0; height: 28px; padding: 0 8px; margin-right: -8px; color: #b24030; white-space: nowrap; }
footer { border-top: 1px solid #dedfd9; margin-top: 48px; padding-top: 24px; padding-bottom: 32px; font-size: 11px; color: #81877b; display: flex; justify-content: space-between; gap: 16px; }
#empty { padding: 72px 0; text-align: center; color: #777c73; }
dialog { width: min(1200px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid #d7dbd2; border-radius: 6px; background: #fafbf9; }
dialog::backdrop { background: #172014b3; }
.dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 20px; }
.dialog-heading h2 { font-size: 15px; }
dialog iframe { height: min(72dvh, 750px); aspect-ratio: auto; }
body:has(dialog[open]) { overflow: hidden; }
[hidden] { display: none !important; }
@media (max-width: 900px) { header, main, footer { padding-left: 24px; padding-right: 24px; } .info { padding: 12px 14px 0; } .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; } }
@media (max-width: 680px) { header, main, footer { padding-left: 18px; padding-right: 18px; } header { height: 72px; } .brand { font-size: 14px; gap: 8px; } .brand-mark { width: 26px; height: 26px; font-size: 20px; } nav { gap: 16px; font-size: 12px; } nav .github { display: none; } .heading { padding: 30px 0 24px; align-items: center; } h1 { font-size: 30px; } .heading-aside strong { font-size: 24px; } .eyebrow { font-size: 9px; } .prompt { display: block; padding: 16px 0; } .prompt-body { margin-top: 9px; } blockquote { font-size: 12px; } .prompt-note { font-size: 11px; } #copy-prompt { margin-top: 12px; } form { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; padding: 22px 0; } .filter-actions { grid-column: 1 / -1; } .check-list { height: 118px; } .gallery { grid-template-columns: minmax(0, 1fr); } footer { flex-wrap: wrap; } dialog iframe { height: 60dvh; } }
  </style>
</head>
<body>
  <header><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">p</span>Pelican Bicycle</a><nav><a class="github" href="https://github.com/zedong-peng/pelican-bicycle">GitHub ↗</a><a class="contribute" href="https://github.com/zedong-peng/pelican-bicycle/blob/main/CONTRIBUTING.md">提交作品 ↗</a></nav></header>
  <main>
    <div class="heading"><div><p class="eyebrow">THE PELICAN COLLECTION / 001</p><h1>鹈鹕骑自行车</h1></div><div class="heading-aside"><strong id="total"></strong>份不同的想象</div></div>
    <div class="prompt"><span class="prompt-label">PROMPT / V1</span><div class="prompt-body"><blockquote><!-- PROMPT --></blockquote><p class="prompt-note">小提示：如果模型回复里出现“内嵌 SVG 和 CSS 动画”这类套话，可以快速判断它画不出像样的鹈鹕——降智了。</p></div><button type="button" id="copy-prompt">复制 prompt</button></div>
    <form aria-label="筛选作品">
      <fieldset data-facet="model"><legend><span class="facet-name">Model<span class="facet-count" data-count-for="model"></span></span></legend><div class="check-list" data-options-for="model" role="group" aria-label="Model 多选"></div></fieldset>
      <fieldset data-facet="effort"><legend><span class="facet-name">Effort<span class="facet-count" data-count-for="effort"></span></span></legend><div class="check-list" data-options-for="effort" role="group" aria-label="Effort 多选"></div></fieldset>
      <fieldset data-facet="provider"><legend><span class="facet-name">Provider<span class="facet-count" data-count-for="provider"></span></span></legend><div class="check-list" data-options-for="provider" role="group" aria-label="Provider 多选"></div></fieldset>
      <fieldset data-facet="harness"><legend><span class="facet-name">Harness<span class="facet-count" data-count-for="harness"></span></span></legend><div class="check-list" data-options-for="harness" role="group" aria-label="Harness 多选"></div></fieldset>
      <div class="filter-actions"><button type="button" id="copy-link">复制链接</button><button type="reset">重置</button></div>
    </form>
    <div class="collection-heading"><h2>全部作品</h2><p id="count" aria-live="polite"></p></div>
    <section class="gallery" aria-label="作品"><!-- RESULTS --></section>
    <p id="empty" hidden>没有匹配的作品。</p>
  </main>
  <footer><span>PELICAN BICYCLE · 一个 prompt，多种结果。</span><a href="https://github.com/zedong-peng/pelican-bicycle/blob/main/README.md">记录规范与来源 ↗</a></footer>
  <dialog aria-labelledby="viewer-title"><div class="dialog-heading"><h2 id="viewer-title"></h2><button type="button" id="close-viewer">关闭</button></div><iframe title="作品放大预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></dialog>
<script>
const cards = [...document.querySelectorAll("article")];
document.querySelector("#total").textContent = String(cards.length).padStart(2, "0");
const form = document.querySelector("form");
const facets = [...form.querySelectorAll("[data-facet]")];
const names = facets.map(facet => facet.dataset.facet);
const lists = Object.fromEntries(facets.map(facet => [facet.dataset.facet, facet.querySelector("[data-options-for]")]));
const applied = Object.fromEntries(names.map(name => [name, []]));
const selectedIn = name => [...lists[name].querySelectorAll('input[type="checkbox"]:checked')].map(box => box.value);
const draftState = () => Object.fromEntries(names.map(name => [name, selectedIn(name)]));
const valuesFor = (name, state) => [...new Set(cards.filter(card => names.every(other => {
  const values = state[other] || [];
  return other === name || !values.length || values.includes(card.dataset[other]);
})).map(card => card.dataset[name]))].sort();
function matches(card, state) { return names.every(name => {
  const values = state[name] || [];
  return !values.length || values.includes(card.dataset[name]);
}); }
function buildList(name, values, checkedValues) {
  const list = lists[name];
  const scrollTop = list.scrollTop;
  const checked = new Set(checkedValues);
  list.replaceChildren(...values.map(value => {
    const label = document.createElement("label");
    label.className = "check-item";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.value = value;
    box.checked = checked.has(value);
    const text = document.createElement("span");
    text.className = "check-text";
    text.textContent = value;
    text.title = value;
    label.append(box, text);
    return label;
  }));
  if (!values.length) {
    const empty = document.createElement("div");
    empty.className = "check-empty";
    empty.textContent = "暂无";
    list.append(empty);
  }
  document.querySelector(`[data-count-for="${name}"]`).textContent = `· ${values.length}`;
  list.scrollTop = scrollTop;
}
function updateAllOptions(state) {
  for (const name of names) buildList(name, valuesFor(name, state), state[name] || []);
  updateScrollHints();
}
function updateOtherOptions(changedName, state) {
  for (const name of names) {
    if (name === changedName) continue;
    buildList(name, valuesFor(name, state), state[name] || []);
  }
  document.querySelector(`[data-count-for="${changedName}"]`).textContent = `· ${valuesFor(changedName, state).length}`;
  updateScrollHints();
}
function updateScrollHints() {
  for (const name of names) {
    const list = lists[name];
    const overflow = list.scrollHeight - list.clientHeight;
    list.classList.toggle("has-more", overflow > 4 && overflow - list.scrollTop > 4);
  }
}
function render() {
  let visible = 0;
  for (const card of cards) {
    card.hidden = !matches(card, applied);
    if (!card.hidden) visible++;
  }
  document.querySelector("#count").textContent = `${visible} / ${cards.length} 作品`;
  document.querySelector("#empty").hidden = visible !== 0;
}
form.addEventListener("submit", event => event.preventDefault());
function writeURL() {
  const params = new URLSearchParams();
  for (const name of names) for (const value of applied[name]) params.append(name, value);
  const query = params.toString();
  try {
    history.replaceState(null, "", query ? `?${query}` : location.pathname);
  } catch {
    // file:// 本地预览不支持 replaceState，忽略即可。
  }
}
function readURL() {
  const params = new URLSearchParams(location.search);
  for (const name of names) {
    const known = new Set(cards.map(card => card.dataset[name]));
    const kept = [];
    for (const raw of params.getAll(name)) {
      if (known.has(raw)) { if (!kept.includes(raw)) kept.push(raw); continue; }
      for (const part of raw.split(",")) {
        const value = part.trim();
        if (known.has(value) && !kept.includes(value)) kept.push(value);
      }
    }
    applied[name] = kept;
  }
}
function apply(changedName) {
  Object.assign(applied, draftState());
  if (changedName) updateOtherOptions(changedName, applied);
  else updateAllOptions(applied);
  render(); writeURL();
}
for (const facet of facets) {
  const name = facet.dataset.facet;
  lists[name].addEventListener("change", () => apply(name));
  lists[name].addEventListener("scroll", updateScrollHints);
}
window.addEventListener("resize", updateScrollHints);
form.addEventListener("reset", event => {
  event.preventDefault();
  for (const name of names) applied[name] = [];
  updateAllOptions(applied); render(); writeURL();
});
const copyButton = document.querySelector("#copy-link");
copyButton.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(location.href);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = location.href;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const original = copyButton.textContent;
  copyButton.textContent = "已复制 ✓";
  setTimeout(() => { copyButton.textContent = original; }, 1500);
});
const copyPromptButton = document.querySelector("#copy-prompt");
copyPromptButton.addEventListener("click", async () => {
  const text = document.querySelector(".prompt blockquote").textContent.trim();
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const original = copyPromptButton.textContent;
  copyPromptButton.textContent = "已复制 ✓";
  setTimeout(() => { copyPromptButton.textContent = original; }, 1500);
});
readURL();
updateAllOptions(applied); render(); writeURL();
const viewer = document.querySelector("dialog");
const viewerFrame = viewer.querySelector("iframe");
document.querySelector(".gallery").addEventListener("click", event => {
  const button = event.target.closest(".expand");
  if (!button) return;
  const card = button.closest("article");
  document.querySelector("#viewer-title").textContent = [...card.querySelectorAll(".meta-text")].map(el => el.textContent).join(" · ");
  viewerFrame.src = card.querySelector("iframe").src;
  viewer.showModal();
});
document.querySelector("#close-viewer").addEventListener("click", () => viewer.close());
viewer.addEventListener("close", () => viewerFrame.removeAttribute("src"));
viewer.addEventListener("click", event => {
  if (event.target !== viewer) return;
  const rect = viewer.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) viewer.close();
});
</script>
</body>
</html>
