    location = /ai-recommend { return 301 /ai-recommend/; }
    location = /ai-recommend/api/stats {
        # Only statistics are exposed. No HTTP job submission exists.
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765/stats;
        proxy_read_timeout 20s;
        client_max_body_size 1k;
        add_header Access-Control-Allow-Origin "https://zedongpeng.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }
    location ^~ /ai-recommend/api/ { return 404; }
    location ^~ /ai-recommend/ {
        alias /var/www/ai-benchmark/;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }
