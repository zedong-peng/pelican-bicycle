    location = /ai-recommend { return 301 /ai-recommend/; }
    location = /ai-recommend/api/usage {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765/usage;
        proxy_read_timeout 20s;
        client_max_body_size 1k;
        add_header Access-Control-Allow-Origin "https://zedongpeng.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }
    location = /ai-recommend/api/stats {
        # Existing statistics endpoint remains read-only.
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765/stats;
        proxy_read_timeout 20s;
        client_max_body_size 1k;
        add_header Access-Control-Allow-Origin "https://zedongpeng.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }
    location = /ai-recommend/api/community/sites {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        access_log off;
    }
    location = /ai-recommend/api/community/test {
        limit_except POST { deny all; }
        limit_req zone=candy_requests burst=2 nodelay;
        limit_req_status 429;
        limit_conn candy_connections 1;
        limit_conn_status 429;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        access_log off;
    }
    location ^~ /ai-recommend/api/ { return 404; }
    location ^~ /ai-recommend/ {
        alias /var/www/ai-benchmark/;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }
