<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Bicycle / 鹈鹕骑自行车</title>
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <header><a class="brand" href="./">Pelican Bicycle</a><nav><a href="https://github.com/zedong-peng/pelican-bicycle">GitHub ↗</a><a href="https://github.com/zedong-peng/pelican-bicycle/blob/main/CONTRIBUTING.md">提交作品 ↗</a></nav></header>
  <main>
    <div class="heading"><div><p class="eyebrow">MODEL / EFFORT / PROVIDER / HARNESS</p><h1>鹈鹕骑自行车</h1></div><p id="count" aria-live="polite"></p></div>
    <blockquote><!-- PROMPT --></blockquote>
    <form aria-label="筛选作品">
      <label>Model<select name="model"><option value="">全部</option></select></label>
      <label>Effort<select name="effort"><option value="">全部</option></select></label>
      <label>Provider<select name="provider"><option value="">全部</option></select></label>
      <label>Harness<select name="harness"><option value="">全部</option></select></label>
      <button type="reset">重置</button>
    </form>
    <section class="gallery" aria-label="作品"><!-- RESULTS --></section>
    <p id="empty" hidden>没有匹配的作品。</p>
  </main>
  <footer>一个 prompt，多种结果。<a href="https://github.com/zedong-peng/pelican-bicycle/blob/main/README.md">记录规范与来源 ↗</a></footer>
</body>
</html>
